services:

  bot:
    build: .
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - MPLCONFIGDIR=/bot/.state-save/matplotlib
    volumes:
      - ./.state-save:/bot/.state-save # Проброс каталога сохранения
      - ./logs:/bot/logs # Проброс каталога логов
      - ./data:/bot/data # Проброс каталога data/
      - ./bot/data:/bot/bot/data # Проброс каталога данных
      - ./config.json:/bot/config.json:ro # Проброс конфига
      - /etc/localtime:/etc/localtime:ro # Проброс времени
      - ./backups:/backups
      - ./fonts:/bot/fonts:ro # Проброс шрифтов
      - ./images/items/generated:/bot/images/items/generated # Проброс папки для прегенерированных картинок (rw)
      - ./images:/bot/images:ro # Проброс изображений
      - ./tools:/bot/tools:ro # Проброс утилит
      - ./bot/localization:/bot/bot/localization:ro # Проброс локализации
      - ./bot/json:/bot/bot/json # Монтаж json данных предметов (rw для записи custom emoji IDs)
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    networks:
      - shared_network


  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    restart: always
    networks:
      - shared_network

  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb:/data/db
    restart: always
    stop_signal: SIGINT
    networks:
      - shared_network

  nginx:
    image: nginx:alpine
    depends_on:
      - bot
    ports:
      - "443:443"
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${SSL_CERT_DIR}/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_CERT_DIR}/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    restart: unless-stopped
    networks:
      - shared_network

networks:
  shared_network:
    name: shared_network
    external: true
