name: Pytest Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run Pytest Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Create dummy config.json and .env for testing
        run: |
          cat > .env << 'EOF'
          BOT_TOKEN=0:ci_stub
          MONGO_USERNAME=
          MONGO_PASSWORD=
          REDIS_PASSWORD=
          EOF
          
          cat > config.json << 'EOF'
          {
              "bot_devs": [12345],
              "bot_group_id": -12345,
              "backup_group_id": -12345,
              "bot_report_id": "-12345",
              "bot_token": "0:ci_stub",
              "debug": true,
              "active_tasks": false,
              "logs_dir": "logs",
              "mongo_url": "mongodb://localhost:27017",
              "redis_url": "redis://localhost:6379",
              "donation_token": "",
              "show_advert": false,
              "advert_token": "",
              "check_translate": false,
              "base_logging": false,
              "only_dev": false,
              "handlers_logging": false,
              "reset_images_base": false
          }
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests with pytest
        run: |
          pytest
